<!doctype html>
<html lang="en"><meta charset="utf-8"><title>PausePay</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 700px at 30% 20%, #174a86 0%, #0b1f3a 60%, #07152a 100%); color: #fff; font: 16px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .mark { width: 120px; height: 120px; border-radius: 30px; background: #fff; display: grid; place-items: center; box-shadow: 0 18px 60px rgba(0,0,0,.35); animation: pop .8s cubic-bezier(.2,1.3,.4,1) both; }
  .mark i { display: inline-block; width: 22px; height: 70px; border-radius: 9px; margin: 0 8px; }
  .mark i:first-child { background: #0070e0; } .mark i:last-child { background: #0b1f3a; }
  h1 { font-size: 92px; margin: 34px 0 6px; letter-spacing: -2px; animation: up .9s .35s both; }
  p.tag { font-size: 33px; margin: 0; color: #cfe3ff; animation: up .9s .6s both; }
  p.sub { font-size: 22px; margin-top: 44px; color: #8fb2e0; animation: up .9s 1.1s both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes up { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
</style>
<div class="wrap">
  <div class="mark"><i></i><i></i></div>
  <h1>PausePay</h1>
  <p class="tag">An AI cooling-off layer for PayPal payments</p>
  <p class="sub">Authorize &middot; Review &middot; Capture or Void</p>
</div>
